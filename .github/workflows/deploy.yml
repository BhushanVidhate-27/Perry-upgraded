name: Deploy to Render

# Every push to main reaches production. Render's GitHub app is not installed
# on this repo, so the push triggers Render's deploy API directly.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dbd471ui0phs73em5q50
        run: |
          test -n "$RENDER_API_KEY" || { echo "Add the RENDER_API_KEY repository secret."; exit 1; }
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "content-type: application/json" \
            -d '{"clearCache":"do_not_clear"}'
